# Measurement/signing belongs to the immutable tagged workflow. This dormant
# template is not a configured publisher: selected config/adapter are absent.
name: Tinfoil intake release - publish
on:
  workflow_dispatch:
    inputs:
      source:
        type: string
        required: true
      build_run:
        type: string
        required: true
      build_attempt:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: intake-signed-release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_AUTOMATION_ENABLED: 'false'
  PRODUCTION_DEPLOYMENT_ENABLED: 'false'
jobs:
  measure-and-release:
    if: ${{ false && vars.RELEASE_AUTOMATION_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse stale/unqualified/partially published invocation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py publication-guard
      # Never reached by the shipped artifacts. Config is intentionally absent;
      # volume/key/listen policy must be approved, not guessed from the gateway.
      - uses: tinfoilsh/measure-image-action@f2ec2fdf4510459730f0a5158c5817f5361e9461 # v0.13.2
        with:
          config-file: ${{ github.workspace }}/nix/release-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
