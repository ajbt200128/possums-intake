# ISOLATED DIAGNOSTIC BRANCH ONLY. NEVER MERGE INTO MAIN.
# A different source/ref is not exact-main release qualification. Manual read-only
# CI-token diagnosis; normal Actions annotation/history retention still applies.
name: Manual read-only CI package evidence probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    if: ${{ github.repository_owner == 'ajbt200128' && github.repository == 'ajbt200128/possums-intake' && github.actor == 'ajbt200128' && github.event.repository.private == true && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Project fixed package predicates into one bounded annotation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
          OTEL_SDK_DISABLED: "true"
        run: python3 scripts/ci-package-evidence-probe.py
